<text x="1387" y="35" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#ffd7dc">RECONSTRUCTED · NOT LIVE CAPTURE</text>
<text x="42" y="102" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#f1f5f9">02 — Interrupted CTranslate2 download, retry and verification</text>
<text x="42" y="132" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#8fa3bd">Transfer failure details are summarized from the lab log; successful retry/check outputs are recorded.</text>
<rect x="28" y="153" width="1544" height="397" rx="12" fill="#05080d" stroke="#26354a"/>
<text x="52" y="188" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\ASR&gt;</tspan><tspan fill="#e2e8f0"> python -m pip install -r requirements.txt</tspan></text><text x="52" y="215" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#f5c26b">CTranslate2 wheel: approximately 20.4 MB.</text><text x="52" y="242" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#ff8a8a">pip repeatedly lost the connection near 19 MB; six attempts failed.</text><text x="52" y="269" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#8fa3bd">Resolution: resume the download and allow a longer network timeout.</text><text x="52" y="296" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\ASR&gt;</tspan><tspan fill="#e2e8f0"> python -m pip install --resume-retries 15 --timeout 120 -r requirements.txt</tspan></text><text x="52" y="323" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#83e6a5">Dependency installation completed.</text><text x="52" y="350" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\ASR&gt;</tspan><tspan fill="#e2e8f0"> python -m pip check</tspan></text><text x="52" y="377" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#83e6a5">No broken requirements found.</text><text x="52" y="404" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\ASR&gt;</tspan><tspan fill="#e2e8f0"> python -m pytest -q</tspan></text><text x="52" y="431" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#83e6a5">28 passed in 2.76s</text><text x="52" y="458" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#f5c26b">Hugging Face: hf_xet unavailable; regular HTTP fallback used.</text><text x="52" y="485" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#f5c26b">Windows symlinks unavailable; less space-efficient cache fallback used.</text><text x="52" y="512" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#83e6a5">Both Hugging Face warnings were non-fatal.</text><text x="1545" y="563" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">Source: conversation commands and recorded outputs · reconstructed exhibit</text></svg>