<text x="42" y="102" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#f1f5f9">01 — Python runtime discovery failure and fix</text>
<text x="42" y="132" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#8fa3bd">Observed setup error; resolution summarized from the corrected setup script and lab notes.</text>
<rect x="28" y="153" width="1544" height="336" rx="12" fill="#05080d" stroke="#26354a"/>
<text x="52" y="188" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\ASR&gt;</tspan><tspan fill="#e2e8f0"> .\scripts\setup.ps1</tspan></text><text x="52" y="215" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#ff8a8a">ERROR: No suitable Python runtime found.</text><text x="52" y="242" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#8fa3bd">Initial setup attempted to probe a Python runtime that was not installed.</text><text x="52" y="269" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#8fa3bd">Resolution: the replacement setup script enumerates installed runtimes first with py -0p.</text><text x="52" y="296" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\ASR&gt;</tspan><tspan fill="#e2e8f0"> py -0p</tspan></text><text x="52" y="323" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">Installed Python runtimes were enumerated; Python 3.12 (64-bit) was selected.</text><text x="52" y="350" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#8fa3bd">The corrected script prefers Python 3.12, then 3.11, and verifies 64-bit architecture.</text><text x="52" y="377" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\ASR&gt;</tspan><tspan fill="#e2e8f0"> python --version</tspan></text><text x="52" y="404" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#83e6a5">Python 3.12.10</text><text x="52" y="431" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#8fa3bd">The final project setup completed using CPython 3.12.10, 64-bit.</text><text x="1545" y="502" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">Source: conversation commands and recorded outputs · reconstructed exhibit</text></svg>