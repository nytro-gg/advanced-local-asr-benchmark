<text x="42" y="102" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#f1f5f9">05 — VAD threshold and window-size diagnostics</text>
<text x="42" y="132" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#8fa3bd">Recorded diagnostic measurements; the original ad hoc diagnostic command text was not preserved in the chat.</text>
<rect x="28" y="153" width="1544" height="505" rx="12" fill="#05080d" stroke="#26354a"/>
<text x="52" y="188" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#8fa3bd">VAD timestamp diagnostics only — no Whisper transcription was run for these sweeps.</text><text x="52" y="215" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">WHOLE-FILE PROCESSING</text><text x="52" y="242" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">Threshold     Regions     Retained audio     Retention</text><text x="52" y="269" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">0.50          1           3.84 s             0.52%</text><text x="52" y="296" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">0.40          3           5.74 s             0.78%</text><text x="52" y="323" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">0.30          4           8.24 s             1.13%</text><text x="52" y="350" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">0.20          4           9.84 s             1.34%</text><text x="52" y="377" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">30-SECOND WINDOW SWEEP</text><text x="52" y="404" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">Threshold 0.50: 37 regions, 145.09 s retained (19.83%)</text><text x="52" y="431" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">Threshold 0.20: 57 regions, 319.50 s retained (43.66%)</text><text x="52" y="458" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">CHUNK-SIZE SWEEP AT THRESHOLD 0.50</text><text x="52" y="485" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">30 s: 37 regions, 145.09 s retained (19.83%)</text><text x="52" y="512" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">60 s: 20 regions, 92.06 s retained (12.58%)</text><text x="52" y="539" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">120 s: 12 regions, 65.07 s retained (8.89%)</text><text x="52" y="566" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">300 s: 4 regions, 14.29 s retained (1.95%)</text><text x="52" y="593" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#f5c26b">Retained duration is not proof that the retained audio is speech.</text><text x="52" y="620" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#8fa3bd">Windowing sensitivity was observed; root cause was not established.</text><text x="1545" y="671" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">Source: conversation commands and recorded outputs · reconstructed exhibit</text></svg>