<text x="118" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#cbd5e1">Windows PowerShell 5.1 — evidence reconstruction</text>
<rect x="1210" y="12" width="355" height="34" rx="10" fill="#4b1c26" stroke="#a94b58"/>
<text x="1387" y="35" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#ffd7dc">RECONSTRUCTED · NOT LIVE CAPTURE</text>
<text x="42" y="102" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#f1f5f9">10 — Windows folder lock and successful post-restart cleanup</text>
<text x="42" y="132" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#8fa3bd">The first deletion failed; the folder was confirmed empty, then deleted successfully after a restart.</text>
<rect x="28" y="153" width="1544" height="370" rx="12" fill="#05080d" stroke="#26354a"/>
<text x="52" y="188" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\Downloads&gt;</tspan><tspan fill="#e2e8f0"> Remove-Item -LiteralPath $OldRoot -Recurse -Force</tspan></text><text x="52" y="215" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#ff8a8a">Cannot remove item: process cannot access the folder because it is being used by another process.</text><text x="52" y="242" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#f5c26b">The script continued and printed “Research cleanup completed” despite the deletion error.</text><text x="52" y="269" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\Downloads&gt;</tspan><tspan fill="#e2e8f0"> Get-ChildItem -LiteralPath $OldRoot -Force</tspan></text><text x="52" y="296" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">Only the nested project directory remained.</text><text x="52" y="323" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\Downloads&gt;</tspan><tspan fill="#e2e8f0"> $Remaining = @(Get-ChildItem -LiteralPath $Inner -Force)</tspan></text><text x="52" y="350" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#83e6a5">Remaining items: 0</text><text x="52" y="377" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#ff8a8a">Removing the empty directory still failed: folder handle remained open.</text><text x="52" y="404" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#8fa3bd">Resolution: close related apps and restart Windows to release the handle.</text><text x="52" y="431" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\WINDOWS\system32&gt;</tspan><tspan fill="#e2e8f0"> Remove-Item -LiteralPath $Inner -Force</tspan></text><text x="52" y="458" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\WINDOWS\system32&gt;</tspan><tspan fill="#e2e8f0"> Remove-Item -LiteralPath $OldRoot -Force</tspan></text><text x="52" y="485" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#83e6a5">Old project exists: False</text><text x="1545" y="536" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">Source: conversation commands and recorded outputs · reconstructed exhibit</text></svg>