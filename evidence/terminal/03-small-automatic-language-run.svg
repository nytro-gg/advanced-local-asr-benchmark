<text x="52" y="188" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#e2e8f0">(.venv) PS C:\ASR&gt; python -m src.evaluate --audio &quot;.\audio\test12.m4a&quot; --model small --device cpu --compute-type int8</text><text x="52" y="215" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#e2e8f0">    --max-audio-seconds 900</text><text x="52" y="242" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">Model: Systran/faster-whisper-small</text><text x="52" y="269" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">Resolved commit: 536b0662742c02347bc0e980a01041f333bce120</text><text x="52" y="296" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">Input duration: 731.743 s | language: English | beam: 5 | VAD: off</text><text x="52" y="323" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#83e6a5">Transcription time: 145.798 s</text><text x="52" y="350" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#83e6a5">Real-time factor: 0.19925  (~5.02x faster than playback)</text><text x="52" y="377" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">Model cache/download: 30.420 s | model load: 10.558 s</text><text x="52" y="404" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">Segments: 63 | peak sampled process RSS: 1,064.01 MiB</text><text x="52" y="431" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">Average sampled process CPU: 358.43% | peak: 425%</text><text x="52" y="458" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#8fa3bd">No human-verified reference transcript was supplied; WER/CER were not measured.</text><text x="52" y="485" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#8fa3bd">The original recording was kept unchanged.</text><text x="1545" y="536" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">Source: conversation commands and recorded outputs · reconstructed exhibit</text></svg>