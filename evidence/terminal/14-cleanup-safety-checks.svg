<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc"><title id="title">14 — Cleanup safety checks and verified deletion</title><desc id="desc">Shows the final safe-delete logic and the post-restart success; the first attempts are in exhibit 10. Reconstructed command transcript; not a live screen capture.</desc><defs><linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#101c2e"/><stop offset="1" stop-color="#17233a"/></linearGradient></defs><rect width="1600" height="520" rx="22" fill="#070b12"/><rect width="1600" height="58" rx="22" fill="url(#top)"/><rect y="36" width="1600" height="22" fill="url(#top)"/><circle cx="30" cy="29" r="8" fill="#ff5f57"/><circle cx="58" cy="29" r="8" fill="#febc2e"/><circle cx="86" cy="29" r="8" fill="#28c840"/><text x="118" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#cbd5e1">Windows PowerShell 5.1 — evidence reconstruction</text><rect x="1210" y="12" width="355" height="34" rx="10" fill="#4b1c26" stroke="#a94b58"/><text x="1387" y="35" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#ffd7dc">RECONSTRUCTED · NOT LIVE CAPTURE</text><text x="42" y="102" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#f1f5f9">14 — Cleanup safety checks and verified deletion</text><text x="42" y="132" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#8fa3bd">Shows the final safe-delete logic and the post-restart success; the first attempts are in exhibit 10.</text><rect x="28" y="153" width="1544" height="336" rx="12" fill="#05080d" stroke="#26354a"/><text x="52" y="188" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\WINDOWS\system32&gt;</tspan><tspan fill="#e2e8f0"> $OldRoot = &quot;$env:USERPROFILE\Downloads\local-speech-model-evaluation-verification-1.2.0&quot;</tspan></text><text x="52" y="215" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\WINDOWS\system32&gt;</tspan><tspan fill="#e2e8f0"> $Inner = Join-Path $OldRoot &quot;local-speech-model-evaluation-verification-1.2.0&quot;</tspan></text><text x="52" y="242" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\WINDOWS\system32&gt;</tspan><tspan fill="#e2e8f0"> $Remaining = @(Get-ChildItem -LiteralPath $Inner -Force -ErrorAction Stop)</tspan></text><text x="52" y="269" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#83e6a5">Remaining items: 0</text><text x="52" y="296" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\WINDOWS\system32&gt;</tspan><tspan fill="#e2e8f0"> Remove-Item -LiteralPath $Inner -Force -ErrorAction Stop</tspan></text><text x="52" y="323" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\WINDOWS\system32&gt;</tspan><tspan fill="#e2e8f0"> Remove-Item -LiteralPath $OldRoot -Force -ErrorAction Stop</tspan></text><text x="52" y="350" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#83e6a5">Old project exists: False</text><text x="52" y="377" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#8fa3bd">Windows was restarted first to release the open directory handle.</text><text x="52" y="404" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#8fa3bd">The separate GitHub clone was checked and preserved.</text><text x="1545" y="502" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">Source: conversation commands and recorded outputs · reconstructed exhibit</text></svg>