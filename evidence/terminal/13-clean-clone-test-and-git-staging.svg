<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="581" viewBox="0 0 1600 581" role="img" aria-labelledby="title desc"><title id="title">13 — Clean-clone test, explicit source staging and diff checks</title><desc id="desc">Commands and outputs are transcribed from the shared publication session. Reconstructed command transcript; not a live screen capture.</desc><defs><linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#101c2e"/><stop offset="1" stop-color="#17233a"/></linearGradient></defs><rect width="1600" height="581" rx="22" fill="#070b12"/><rect width="1600" height="58" rx="22" fill="url(#top)"/><rect y="36" width="1600" height="22" fill="url(#top)"/><circle cx="30" cy="29" r="8" fill="#ff5f57"/><circle cx="58" cy="29" r="8" fill="#febc2e"/><circle cx="86" cy="29" r="8" fill="#28c840"/><text x="118" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#cbd5e1">Windows PowerShell 5.1 — evidence reconstruction</text><rect x="1210" y="12" width="355" height="34" rx="10" fill="#4b1c26" stroke="#a94b58"/><text x="1387" y="35" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#ffd7dc">RECONSTRUCTED · NOT LIVE CAPTURE</text><text x="42" y="102" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#f1f5f9">13 — Clean-clone test, explicit source staging and diff checks</text><text x="42" y="132" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#8fa3bd">Commands and outputs are transcribed from the shared publication session.</text><rect x="28" y="153" width="1544" height="397" rx="12" fill="#05080d" stroke="#26354a"/><text x="52" y="188" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\ASR&gt;</tspan><tspan fill="#e2e8f0"> git clone https://github.com/nytro-gg/local-speech-model-evaluation.git $RepoPath</tspan></text><text x="52" y="215" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#83e6a5">Clone completed from the public repository.</text><text x="52" y="242" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\Downloads\local-speech-model-evaluation-github&gt;</tspan><tspan fill="#e2e8f0"> &amp; $Python -m pytest -q</tspan></text><text x="52" y="269" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#83e6a5">28 passed in 0.35s</text><text x="52" y="296" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\ASR&gt;</tspan><tspan fill="#e2e8f0"> git -C $RepoPath add -- .gitignore README.md CHANGELOG.md MODEL_NOTES.md SHA256SUMS.txt TEST_PROTOCOL.md</tspan></text><text x="52" y="323" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#e2e8f0">    VERIFICATION_REPORT.md requirements.txt docs/package-quickstart.md audio/README.md models/README.md results/README.md</text><text x="52" y="350" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#e2e8f0">    scripts/setup.ps1 scripts/run-small.ps1 src/evaluate.py tests/test_evaluate.py</text><text x="52" y="377" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#f5c26b">Git warned that LF would be replaced by CRLF in the Windows working copy.</text><text x="52" y="404" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\ASR&gt;</tspan><tspan fill="#e2e8f0"> git -C $RepoPath diff --cached --check</tspan></text><text x="52" y="431" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#83e6a5">Whitespace check passed.</text><text x="52" y="458" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\ASR&gt;</tspan><tspan fill="#e2e8f0"> git -C $RepoPath diff --cached --stat</tspan></text><text x="52" y="485" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">16 files changed, 1,200 insertions(+), 11 deletions(-)</text><text x="52" y="512" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#8fa3bd">The LF/CRLF messages were line-ending normalization warnings, not failed staging.</text><text x="1545" y="563" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">Source: conversation commands and recorded outputs · reconstructed exhibit</text></svg>