<text x="42" y="102" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#f1f5f9">09 — Push confirmation, clean status and moved local clone</text>
<text x="42" y="132" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#8fa3bd">The wrong-path error happened after the clone was moved from Downloads to Desktop.</text>
<rect x="28" y="153" width="1544" height="336" rx="12" fill="#05080d" stroke="#26354a"/>
<text x="52" y="188" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\WINDOWS\system32&gt;</tspan><tspan fill="#e2e8f0"> git -C &quot;$env:USERPROFILE\Downloads\local-speech-model-evaluation-github&quot; pull origin main</tspan></text><text x="52" y="215" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#ff8a8a">fatal: cannot change to ...Downloads\local-speech-model-evaluation-github: No such file or directory</text><text x="52" y="242" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#8fa3bd">Cause: the local clone had been moved to Desktop\Local Speech Model\V2.</text><text x="52" y="269" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\WINDOWS\system32&gt;</tspan><tspan fill="#e2e8f0"> $Base = &quot;$env:USERPROFILE\Desktop\Local Speech Model\V2&quot;</tspan></text><text x="52" y="296" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\WINDOWS\system32&gt;</tspan><tspan fill="#e2e8f0"> $OldLocal = Join-Path $Base &quot;local-speech-model-evaluation-github&quot;</tspan></text><text x="52" y="323" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#83e6a5">git -C $OldLocal pull origin main -&gt; fast-forward to e5335f5</text><text x="52" y="350" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\WINDOWS\system32&gt;</tspan><tspan fill="#e2e8f0"> git clone https://github.com/nytro-gg/advanced-local-asr-benchmark.git $NewLocal</tspan></text><text x="52" y="377" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#83e6a5">Receiving objects: 100% (47/47), 1.74 MiB; done.</text><text x="52" y="404" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\WINDOWS\system32&gt;</tspan><tspan fill="#e2e8f0"> git -C $NewLocal status --short --branch</tspan></text><text x="52" y="431" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#83e6a5">## main...origin/main</text><text x="1545" y="502" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">Source: conversation commands and recorded outputs · reconstructed exhibit</text></svg>