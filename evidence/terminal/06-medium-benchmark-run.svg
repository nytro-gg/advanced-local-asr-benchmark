<text x="52" y="188" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#e2e8f0">(.venv) PS C:\ASR&gt; python -m src.evaluate --audio &quot;.\audio\test12.m4a&quot; --model medium --device cpu --compute-type int8</text><text x="52" y="215" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#e2e8f0">    --max-audio-seconds 900</text><text x="52" y="242" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">Model: Systran/faster-whisper-medium</text><text x="52" y="269" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">Resolved commit: 08e178d48790749d25932bbc082711ddcfdfbc4f</text><text x="52" y="296" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">Input: same 731.743 s M4A | automatic language | beam 5 | VAD off</text><text x="52" y="323" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#83e6a5">Transcription time: 302.089 s | RTF: 0.41283</text><text x="52" y="350" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">Model download/cache: 66.484 s | model load: 3.518 s</text><text x="52" y="377" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">Segments: 147 | detected language: English | probability: 0.35788</text><text x="52" y="404" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">Peak sampled process RSS: 2,644.46 MiB</text><text x="52" y="431" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">Average sampled process CPU: 385.76% | peak: 425%</text><text x="52" y="458" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#f5c26b">Same non-fatal hf_xet and Windows symlink cache warnings appeared.</text><text x="52" y="485" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#8fa3bd">Medium took about 2.07x as long and used about 2.49x peak sampled RSS vs Small.</text><text x="52" y="512" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#8fa3bd">No verified reference transcript; no WER/CER or accuracy winner claimed.</text><text x="1545" y="563" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">Source: conversation commands and recorded outputs · reconstructed exhibit</text></svg>