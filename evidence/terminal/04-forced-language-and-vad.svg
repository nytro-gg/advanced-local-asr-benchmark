<text x="42" y="102" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#f1f5f9">04 — Forced-English trial and VAD full-recording failure</text>
<text x="42" y="132" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#8fa3bd">Both commands and measured values are taken from the experiment record.</text>
<rect x="28" y="153" width="1544" height="370" rx="12" fill="#05080d" stroke="#26354a"/>
<text x="52" y="188" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#e2e8f0">(.venv) PS C:\ASR&gt; python -m src.evaluate --audio &quot;.\audio\test12.m4a&quot; --model small --device cpu --compute-type int8</text><text x="52" y="215" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#e2e8f0">    --language en --max-audio-seconds 900</text><text x="52" y="242" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">Forced English | VAD off | 731.743 s input</text><text x="52" y="269" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#83e6a5">Transcription: 138.580 s | RTF: 0.18938 | segments: 85</text><text x="52" y="296" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">Peak sampled process RSS: 1,064.84 MiB | average CPU: 388.81%</text><text x="52" y="323" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#f5c26b">Reported language probability 1.0 is not independent confidence; English was forced.</text><text x="52" y="350" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#e2e8f0">(.venv) PS C:\ASR&gt; python -m src.evaluate --audio &quot;.\audio\test12.m4a&quot; --model small --device cpu --compute-type int8</text><text x="52" y="377" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#e2e8f0">    --language en --vad --max-audio-seconds 900</text><text x="52" y="404" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#ff8a8a">VAD-on run completed in 3.779 s but emitted only 2 segments.</text><text x="52" y="431" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#ff8a8a">Only about 3.84 s (0.52%) of the 731.743 s input was retained.</text><text x="52" y="458" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#f5c26b">The apparent RTF of 0.00516 is misleading: almost all input audio was discarded.</text><text x="52" y="485" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#8fa3bd">This is not a valid full-recording speed comparison. Default whole-file VAD was rejected for this recording.</text><text x="1545" y="536" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">Source: conversation commands and recorded outputs · reconstructed exhibit</text></svg>