<text x="42" y="102" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#f1f5f9">07 — Package staging and test verification</text>
<text x="42" y="132" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#8fa3bd">Commands and outputs are selected from the shared PowerShell transcript.</text>
<rect x="28" y="153" width="1544" height="336" rx="12" fill="#05080d" stroke="#26354a"/>
<text x="52" y="188" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\ASR&gt;</tspan><tspan fill="#e2e8f0"> Compress-Archive -Path &quot;$Stage\*&quot; -DestinationPath $Zip -Force</tspan></text><text x="52" y="215" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#83e6a5">speech-eval-source.zip created (22,401 bytes).</text><text x="52" y="242" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\Downloads\local-speech-model-evaluation-github&gt;</tspan><tspan fill="#e2e8f0"> &amp; $Python -m pytest -q</tspan></text><text x="52" y="269" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#83e6a5">28 passed in 0.35s</text><text x="52" y="296" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\Downloads&gt;</tspan><tspan fill="#e2e8f0"> git -C $RepoPath diff --cached --check</tspan></text><text x="52" y="323" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#83e6a5">No whitespace errors reported.</text><text x="52" y="350" font-family="Cascadia Mono,Consolas,monospace" font-size="18"><tspan fill="#70e0a1">PS C:\Downloads&gt;</tspan><tspan fill="#e2e8f0"> git -C $RepoPath diff --cached --stat</tspan></text><text x="52" y="377" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">16 files changed, 1,200 insertions(+), 11 deletions(-)</text><text x="52" y="404" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#cbd5e1">Included: README, requirements, src/evaluate.py, tests, scripts, reports, docs and evidence README.</text><text x="52" y="431" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#8fa3bd">Audio/model cache directories were not included in the explicit staging list.</text><text x="1545" y="502" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">Source: conversation commands and recorded outputs · reconstructed exhibit</text></svg>